name: zerotrust_home
description: "Zero-Trust Home: private, local-first smart home control. End-to-end encrypted."
publish_to: none
version: 0.6.0+11

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Core main 0.12.0 (release merge, 2026-11-14). Switch to the v0.12.0 tag
  # once it is pushed. Never add cryptography_flutter: it breaks the core's
  # key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: cd50d2ddfeb18abb25687b9f956478d7ced83aae
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Password-reset links that open the app (see lib/app/email_links.dart).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  # AES and HMAC for the Tuya local protocol (lib/adapters/tuya). Pure Dart.
  pointycastle: ^4.0.0

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  # Core Dev at the merge of PR #57, which adds the `home` app id.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: 277df7b098227f8aa49cf3c5e761c517069878e7
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
